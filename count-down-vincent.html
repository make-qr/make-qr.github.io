<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Nghỉ Việc</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 500px;
  width: 100%;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

h1 {
  font-size: 24px;
}

h2 {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 15px;
}

.date {
  font-size: 14px;
  color: #bbb;
  margin-bottom: 20px;
}

.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 20px 0;
}

.box {
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 10px;
}

.number {
  font-size: 22px;
  font-weight: bold;
}

.label {
  font-size: 11px;
  color: #aaa;
}

.phase {
  margin-top: 10px;
  font-size: 14px;
}

.progress-wrapper {
  margin: 20px 0;
}

.progress-bar {
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #00c6ff, #0072ff);
  transition: width 0.4s ease;
}

.percent {
  margin-top: 8px;
  font-size: 13px;
  color: #ccc;
}

.quote {
  margin-top: 15px;
  font-size: 13px;
  color: #ddd;
  font-style: italic;
}

/* Mobile */
@media (max-width: 480px) {
  .number { font-size: 18px; }
  h1 { font-size: 20px; }
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h1>📆 Countdown Nghỉ Việc</h1>
    <h2>Thắng Trần - Vincent</h2>

    <div class="date">
      Ngày làm việc cuối: <span id="endDate"></span>
    </div>

    <div class="countdown">
      <div class="box">
        <div id="days" class="number">0</div>
        <div class="label">Days</div>
      </div>
      <div class="box">
        <div id="hours" class="number">0</div>
        <div class="label">Hours</div>
      </div>
      <div class="box">
        <div id="minutes" class="number">0</div>
        <div class="label">Minutes</div>
      </div>
      <div class="box">
        <div id="seconds" class="number">0</div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <div class="phase" id="phase"></div>

    <div class="progress-wrapper">
      <div class="progress-bar">
        <div class="progress" id="progressBar"></div>
      </div>
      <div class="percent" id="percent"></div>
    </div>

    <div class="quote" id="quote"></div>
  </div>
</div>

<script>
const start = new Date("2026-04-13T00:00:00");
const end = new Date("2026-05-08T15:50:00");

function formatDateTime(date) {
  return date.toLocaleString('vi-VN');
}

document.getElementById("endDate").innerText = formatDateTime(end);

function update() {
  const now = new Date();
  const distance = end - now;

  if (distance <= 0) {
    document.body.innerHTML = "<h1>🎉 ĐÃ HOÀN TẤT BÀN GIAO 🎉</h1>";
    return;
  }

  // countdown
  const days = Math.floor(distance / (1000*60*60*24));
  const hours = Math.floor((distance / (1000*60*60)) % 24);
  const minutes = Math.floor((distance / (1000*60)) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  document.getElementById("days").innerText = days;
  document.getElementById("hours").innerText = hours;
  document.getElementById("minutes").innerText = minutes;
  document.getElementById("seconds").innerText = seconds;

  // phase
  let phase = "";
  if (days > 20) phase = "Giai đoạn khởi đầu";
  else if (days > 5) phase = "Đang tiến dần đến thời điểm kết thúc";
  else phase = "Giai đoạn hoàn tất";
  document.getElementById("phase").innerText = phase;

  // progress chuẩn
  const totalTime = end - start;
  const elapsed = now - start;

  let percent = (elapsed / totalTime) * 100;
  percent = Math.min(100, Math.max(0, percent));

  document.getElementById("percent").innerText =
    percent.toFixed(1) + "% hoàn thành";

  document.getElementById("progressBar").style.width =
    percent + "%";

  // quote
  let quote = "";
  if (days > 20) quote = "Đang trong quá trình chuyển giao.";
  else if (days > 10) quote = "Các công việc đang được hoàn thiện.";
  else if (days > 3) quote = "Đang hoàn tất các bước cuối cùng.";
  else quote = "Sẵn sàng cho giai đoạn tiếp theo.";

  document.getElementById("quote").innerText = quote;
}

update();
setInterval(update, 1000);
</script>

</body>
</html>
