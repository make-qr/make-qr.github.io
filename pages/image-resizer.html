<body class="page-body" data-tool="image-resizer">
<main class="max-w-4xl mx-auto px-4 py-8">

<div class="text-center mb-8">
  <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-3">Image Resizer</h1>
