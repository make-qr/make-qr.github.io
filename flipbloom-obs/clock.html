<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlipBloom OBS — Live Clock</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body class="obs-page">
  <main class="obs-stage">
    <p class="obs-kicker">FlipBloom</p>
    <h1 class="obs-title" data-obs-title>Live Clock</h1>
    <p class="obs-sub" data-obs-sub>Real-time flip clock for your stream overlay.</p>
    <div class="fb-clock" data-obs-clock aria-live="polite"></div>
    <div class="obs-phase" data-obs-phase>Local time</div>
    <p class="obs-brand">FlipBloom Timer</p>
  </main>
  <script src="js/overlay.js"></script>
  <script>
    FlipBloomOBS.applyChrome();
    const tz = new URLSearchParams(location.search).get('tz');
    const phase = document.querySelector('[data-obs-phase]');
    if (tz && phase) phase.textContent = tz;
    FlipBloomOBS.startLiveClock();
  </script>
</body>
</html>
